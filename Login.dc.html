<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:oklch(98% 0.006 95);--surface:oklch(100% 0 0);--surface-2:oklch(96.3% 0.006 95);
  --text:oklch(22% 0.02 280);--text-muted:oklch(52% 0.02 280);--text-faint:oklch(68% 0.015 280);
  --border:oklch(91% 0.006 95);--primary:oklch(58% 0.16 275);
  --radius:20px;--radius-sm:14px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);}
a{color:var(--primary);text-decoration:none;} a:hover{color:oklch(48% 0.16 275);}
.screen{width:390px;min-height:844px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:36px;}
.content{flex:1;padding:0 26px;display:flex;flex-direction:column;}
.row{display:flex;flex-direction:row;align-items:center;} .col{display:flex;flex-direction:column;}
.between{justify-content:space-between;}
p{margin:0;}
.field-label{font-size:12.5px;font-weight:700;color:var(--text-muted);}
.field{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:var(--surface);display:flex;flex-direction:row;align-items:center;justify-content:space-between;min-height:52px;}
.btn-primary{background:var(--primary);color:#fff;border-radius:999px;padding:16px;text-align:center;font-size:15px;font-weight:700;}
.btn-google{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:14px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;font-size:14.5px;font-weight:700;}
.btn-apple{background:#000;color:#fff;border-radius:999px;padding:14px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:9px;font-size:14.5px;font-weight:700;}
.divider-line{flex:1;height:1px;background:var(--border);}
</style>
</helmet>

<div class="screen">
  <div class="content">

    <div class="col" style="align-items:center;gap:14px;padding-top:76px;padding-bottom:36px">
      <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg, oklch(58% 0.16 275), oklch(52% 0.17 296));display:flex;align-items:center;justify-content:center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      </div>
      <div class="col" style="align-items:center;gap:4px">
        <p style="font-size:22px;font-weight:800;letter-spacing:-0.02em">LifePlan</p>
        <p style="font-size:13px;color:var(--text-faint);font-weight:600">วางแผนและวัดผลทุกด้านของชีวิตในที่เดียว</p>
      </div>
    </div>

    <div class="col" style="gap:18px">

      <div class="col" style="gap:7px">
        <p class="field-label">อีเมล</p>
        <div class="field">
          <p style="font-size:14px;color:var(--text-faint)">you@example.com</p>
        </div>
      </div>

      <div class="col" style="gap:7px">
        <p class="field-label">รหัสผ่าน</p>
        <div class="field">
          <p style="font-size:14px;color:var(--text)">••••••••</p>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>

      <p style="align-self:flex-end;font-size:12.5px;font-weight:700;color:var(--primary)">ลืมรหัสผ่าน?</p>

      <div class="btn-primary">เข้าสู่ระบบ</div>

      <div class="row" style="gap:12px;padding:2px 0">
        <div class="divider-line"></div>
        <p style="font-size:12px;color:var(--text-faint);font-weight:600;white-space:nowrap">หรือเข้าสู่ระบบด้วย</p>
        <div class="divider-line"></div>
      </div>

      <div class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        <p>ดำเนินการต่อด้วย Google</p>
      </div>

      <div class="btn-apple">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M16.125 12.469c-.02-2.061 1.687-3.05 1.764-3.098-.964-1.409-2.464-1.602-2.996-1.624-1.275-.13-2.49.75-3.138.75-.649 0-1.65-.732-2.713-.712-1.396.02-2.684.812-3.404 2.063-1.452 2.516-.371 6.24 1.043 8.281.692 1.001 1.516 2.123 2.598 2.083 1.043-.041 1.437-.675 2.698-.675 1.26 0 1.615.675 2.716.653 1.123-.02 1.834-1.019 2.52-2.026.795-1.161 1.122-2.286 1.14-2.344-.025-.011-2.185-.839-2.207-3.328zM14.03 5.905c.574-.697.962-1.665.856-2.63-.827.033-1.827.55-2.42 1.246-.532.618-.998 1.606-.873 2.552.923.072 1.864-.469 2.437-1.168z"/></svg>
        <p>ดำเนินการต่อด้วย Apple</p>
      </div>

    </div>

    <div class="row" style="justify-content:center;gap:6px;padding:28px 0 36px;margin-top:auto">
      <p style="font-size:13px;color:var(--text-muted);font-weight:600">ยังไม่มีบัญชี?</p>
      <p style="font-size:13px;font-weight:800;color:var(--primary)">สมัครสมาชิก</p>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
